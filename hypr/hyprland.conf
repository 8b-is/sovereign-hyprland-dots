# ══════════════════════════════════════════════════════════════════════════════
# SOVEREIGN 8b.is × QWAVE × MACCRACKEN × NOCTALIA AI WORKSTATION
# Zero-Password Boot · 100% Pure-Rust HUD · C64 64KB Ring · Zero-Float Salience
# Constellation Ink × Neon Jungle × Catppuccin Mocha (#05060a / #00f0ff / #cba6f7 / #62e6c9 / #e8b05c)
# hapi: drift-audit 2026-11-06 — merged macCracken/dotfiles (hyprlock, hypridle,
#       mocha, neon_jungle glass blur, 6-curve animations) + Noctalia AGY/BongoCat dock
# Validated for Hyprland 0.57.1+
# ══════════════════════════════════════════════════════════════════════════════

source = ~/.config/hypr/mocha.conf

# ─── 1. MONITORS & SCALING ───────────────────────────────────────────────────
monitor = DP-2, disable
monitor = desc:Apple Computer Inc ProDisplayXDR 0x0F090B03, 5120x2880@60, 2560x0, 2, vrr, 0
monitor = desc:Apple Computer Inc ProDisplayXDR 0x0F090B03, transform, 3
monitor = desc:Apple Computer Inc ProDisplayXDR 0x340F0A03, preferred, 0x1080, 2, vrr, 0
monitor = HDMI-A-1, 3840x2160@60, 0x0, 2, vrr, 0
monitor = HDMI-A-2, 3840x2160@60, 4000x0, 2, vrr, 0
monitor = HDMI-A-3, 3840x2160@60, 4000x0, 2, vrr, 0
monitor = , preferred, auto, 2
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

# ─── 2. ENVIRONMENT VARIABLES ────────────────────────────────────────────────
env = AQ_DRM_DEVICES,/dev/dri/by-path/pci-0000:00:02.0-card:/dev/dri/by-path/pci-0000:01:00.0-card
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = OLLAMA_HOST,127.0.0.1:11436
env = PATH,/home/hue/.local/bin:/home/hue/.cargo/bin:/usr/local/bin:/usr/bin:/bin

# ─── 3. AUTOSTART (exec-once) ────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = /home/hue/.local/bin/qwave-hypr-hud boot-session
exec-once = /home/hue/.local/bin/qwave-hypr-hud smoke-bg 0
exec-once = sh -c "pidof hypridle >/dev/null 2>&1 || hypridle"
exec-once = [workspace 1 silent] alacritty --working-directory /home/hue/8b-is
exec-once = [workspace 2 silent] chromium http://127.0.0.1:8787 https://cheet.is/a6000 https://g8t.is https://gemini-diary.8b.is

# ─── 4. WORKSPACE DEFINITIONS ────────────────────────────────────────────────
workspace = 1, defaultName:1:STUDIO, persistent:true
workspace = 2, defaultName:2:CONSTELLATION, persistent:true
workspace = 3, defaultName:3:QWAVE-LAB, persistent:true
workspace = 4, defaultName:4:MODELS, persistent:true
workspace = 5, defaultName:5:FLEET, persistent:true
workspace = 6, defaultName:6:MUSIC, persistent:true

# ─── 5. LOOK & FEEL (Constellation Ink × Neon Jungle × Mocha Glass) ──────────
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = 0xff00f0ff 0xffcba6f7 0xff62e6c9 0xffe8b05c 45deg
    col.inactive_border = 0xff313244
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = 0x6605060a
    }

    blur {
        enabled = false
        size = 4
        passes = 1
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.22
    }
}

animations {
    enabled = true

    # macCracken/dotfiles 6-curve suite
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor,    1, 7,    quick
}

dwindle {
    smart_resizing = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

# ─── 6. AI DEVELOPMENT, VOICE, NOCTALIA & MACCRACKEN KEYBINDINGS ─────────────
$mainMod = SUPER
$hud = /home/hue/.local/bin/qwave-hypr-hud

bind = $mainMod, O, exec, $hud ai-menu
bind = $mainMod, X, exec, $hud ai-clip --mode explain
bind = $mainMod SHIFT, X, exec, $hud ai-clip --mode fix
bind = $mainMod, SPACE, exec, $hud voice-type
bind = $mainMod, V, exec, $hud voice-type
bind = $mainMod, A, exec, $hud ask-aye
bind = $mainMod, M, exec, $hud toggle-ear
bind = $mainMod SHIFT, M, exec, nwg-displays
bind = $mainMod, D, exec, $hud markdown-hud
bind = $mainMod, G, exec, $hud a6000-pulse
bind = $mainMod, I, exec, alacritty --class agy-terminal -T "8b.is Sovereign AGY Studio (Resumed)" --working-directory /home/hue/8b-is -e $hud agy-resume
bind = $mainMod SHIFT, Return, exec, alacritty --class agy-terminal -T "8b.is Sovereign AGY Studio (Resumed)" --working-directory /home/hue/8b-is -e $hud agy-resume
bind = $mainMod, W, exec, $hud wifi-menu
bind = $mainMod SHIFT, W, exec, $hud wifi-tui
bind = $mainMod, N, exec, noctalia msg panel-toggle control-center
bind = $mainMod, U, exec, $hud vault-menu
bind = $mainMod, T, exec, $hud tokyo-song
bind = $mainMod, Y, exec, $hud humayian-mix
bind = $mainMod SHIFT, P, exec, $hud phoenix-menu
bind = $mainMod CTRL, P, exec, $hud phoenix-preset next

# Noctalia Plugins & macCracken Lock / Wallpaper / Notes / Docker / Process Monitor
bind = $mainMod SHIFT, ESCAPE, exec, hyprlock
bind = $mainMod CTRL, B, exec, noctalia msg bar-toggle
bind = $mainMod CTRL, W, exec, noctalia msg desktop-widgets-toggle
bind = $mainMod CTRL, N, exec, noctalia msg panel-toggle noctalia/notes:panel
bind = $mainMod CTRL, D, exec, noctalia msg panel-toggle 8bury/mini-docker:manager
bind = $mainMod CTRL, M, exec, noctalia msg panel-toggle yahya637/process-monitor:panel
bind = $mainMod, period, exec, noctalia msg launcher-open /kaomoji
bind = $mainMod ALT, W, exec, noctalia msg wallpaper-random

# Self-Healing AI Scratchpads
bind = $mainMod, grave, exec, $hud scratchpad term
bind = $mainMod, semicolon, exec, $hud scratchpad term
bind = $mainMod, Z, exec, $hud scratchpad qwave
bind = $mainMod SHIFT, D, exec, $hud scratchpad qwave
bind = $mainMod SHIFT, G, exec, $hud scratchpad btop

# Core Studio Application Launchers
bind = $mainMod, Return, exec, alacritty --working-directory /home/hue/8b-is
bind = $mainMod, B, exec, $hud markdown-hud
bind = $mainMod SHIFT, B, exec, chromium http://127.0.0.1:8787 https://cheet.is/a6000 https://g8t.is https://gemini-diary.8b.is
bind = $mainMod, R, exec, sh -c "noctalia msg panel-toggle launcher || wofi --show drun || fuzzel"
bind = $mainMod, E, exec, alacritty -e /home/hue/.local/bin/qwave /home/hue/8b-is/qwave/README.md
bind = , Print, exec, sh -c 'grim -g "$(slurp)" - | wl-copy && notify-send "Sovereign Capture [+]" "Region copied to Wayland clipboard"'
bind = $mainMod, Print, exec, sh -c 'grim -g "$(slurp)" - | wl-copy && notify-send "Sovereign Capture [+]" "Region copied to Wayland clipboard"'
bind = $mainMod SHIFT, S, exec, sh -c 'grim -g "$(slurp)" - | wl-copy && notify-send "Sovereign Capture [+]" "Region copied to Wayland clipboard"'

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, C, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, S, layoutmsg, togglesplit
bind = $mainMod, backslash, layoutmsg, togglesplit
bind = $mainMod CTRL, R, exec, hyprctl reload

# Focus Navigation (Arrow keys & Complete Vim H/J/K/L)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Swap Windows
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, L, swapwindow, r

# Resize Windows
binde = $mainMod CTRL, left, resizeactive, -60 0
binde = $mainMod CTRL, right, resizeactive, 60 0
binde = $mainMod CTRL, up, resizeactive, 0 -60
binde = $mainMod CTRL, down, resizeactive, 0 60
binde = $mainMod CTRL, H, resizeactive, -60 0
binde = $mainMod CTRL, L, resizeactive, 60 0
binde = $mainMod CTRL, K, resizeactive, 0 -60
binde = $mainMod CTRL, J, resizeactive, 0 60

# Workspace Switching (SUPER + 1..9, 0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Active Window to Workspace (SUPER + SHIFT + 1..9, 0)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through Workspaces & Mouse Drag/Resize
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia, PipeWire Volume, Mic Mute & Brightness Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPrev, exec, playerctl previous

# ─── 7. WINDOW RULES ─────────────────────────────────────────────────────────
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-agy-terminal
    match:class = agy-terminal
    float = true
    size = 1280 800
    center = true
}

windowrule {
    name = float-wifi-manager
    match:class = wifi-manager
    float = true
    size = 960 640
    center = true
}

windowrule {
    name = float-ai-dialog
    match:class = ai-floating
    float = true
    size = 1120 720
    center = true
}

windowrule {
    name = float-ai-scratch-term
    match:class = ai-scratch-term
    float = true
    size = 1220 720
    center = true
}

windowrule {
    name = float-qwave-radar
    match:class = qwave-radar
    float = true
    size = 1260 760
    center = true
}

windowrule {
    name = float-btop-hud
    match:class = btop-hud
    float = true
    size = 1260 760
    center = true
}

windowrule {
    name = opaque-chromium
    match:class = ^(chromium|firefox|brave-browser|zen|mpv|imv)$
    opacity = 1.0 override 1.0 override
}
