# ══════════════════════════════════════════════════════════════════════════════
# SOVEREIGN 8b.is × QWAVE × ALEXIAI COLLABORATION HYPRLAND WORKSTATION
# Zero-Password Boot · 100% Pure-Rust HUD · C64 64KB Ring · Zero-Float Salience
# Validated for Hyprland 0.56.2+
# ══════════════════════════════════════════════════════════════════════════════

# ─── 1. MONITORS & SCALING ───────────────────────────────────────────────────
# Crisp HiDPI integer scaling (2x) on internal eDP-1 panel + auto-config for external displays
monitor = eDP-1, preferred, auto, 2
monitor = , preferred, auto, 1

# ─── 2. ENVIRONMENT VARIABLES (Zero Keyring / Polkit Prompts) ────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = PATH,/home/hue/.local/bin:/usr/local/bin:/usr/bin:/bin

# ─── 3. AUTOSTART (exec-once) ────────────────────────────────────────────────
# Export Wayland session variables and unlock passwordless keyring
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = sh -c "printf '' | gnome-keyring-daemon --replace --unlock --components=pkcs11,secrets --daemonize"

# Launch Sovereign Waybar & Pure-Rust Qwave Boot Session Orchestrator
exec-once = sh -c "command -v nm-applet >/dev/null 2>&1 && nm-applet --indicator || true"
exec-once = waybar
exec-once = /home/hue/.local/bin/qwave-hypr-hud boot-session

# Workspace 1 (1:AI-STUDIO): Sovereign AGY Studio (Resumed) + Live Qwave TUI HUD + /home/hue/8b-is shell
exec-once = [workspace 1 silent] alacritty -T "8b.is Sovereign AGY Studio (Resumed)" --working-directory /home/hue/8b-is -e /home/hue/.local/bin/qwave-hypr-hud agy-resume
exec-once = [workspace 1 silent] alacritty -T "Qwave Sovereign HUD" -e /home/hue/.local/bin/qwave-hypr-hud status-tui
exec-once = [workspace 1 silent] alacritty --working-directory /home/hue/8b-is

# Workspace 2 (2:CONSTELLATION): ALEXIAI (:8787), A6000 (cheet.is/a6000), g8t.is, gemini-diary.8b.is
exec-once = [workspace 2 silent] chromium --password-store=basic http://127.0.0.1:8787 https://cheet.is/a6000 https://g8t.is https://gemini-diary.8b.is

# Workspace 3 (3:QWAVE-LAB): Audio & ESP32-S3 VAK:MEDUSA Telemetry Terminal
exec-once = [workspace 3 silent] alacritty -T "Qwave & ESP32-S3 Telemetry Lab" --working-directory /home/hue/8b-is/qwave -e /home/hue/.local/bin/qwave-hypr-hud status-tui

# Special Scratchpad (special:qwave): Dropdown Radar HUD (SUPER + D)
exec-once = [workspace special:qwave silent] alacritty --class qwave-radar -T "Qwave Radar Scratchpad" -e /home/hue/.local/bin/qwave-hypr-hud status-tui

# ─── 4. WORKSPACE DEFINITIONS ────────────────────────────────────────────────
workspace = 1, defaultName:1:AI-STUDIO, persistent:true
workspace = 2, defaultName:2:CONSTELLATION, persistent:true
workspace = 3, defaultName:3:QWAVE-LAB, persistent:true
workspace = 4, defaultName:4:DRA-DOCS, persistent:true

# ─── 5. LOOK & FEEL (Sovereign 8b.is Cyan 0xff00f0ff & Gold 0xffffb800) ──────
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = 0xff00f0ff 0xffffb800 45deg
    col.inactive_border = 0xff1e293b
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = 0x66000000
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0
    }
}

animations {
    enabled = true
    bezier = sovereignCurve, 0, 1, 0, 1
    animation = windows, 1, 4, sovereignCurve
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

dwindle {
    smart_resizing = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# ─── 6. VOICE & AI COLLABORATION KEYBINDINGS ─────────────────────────────────
$mainMod = SUPER

# Sovereign Voice & AI Hotkeys (100% Pure-Rust qwave-hypr-hud)
bind = $mainMod, SPACE, exec, /home/hue/.local/bin/qwave-hypr-hud voice-type
bind = $mainMod, V, exec, /home/hue/.local/bin/qwave-hypr-hud voice-type
bind = $mainMod, A, exec, /home/hue/.local/bin/qwave-hypr-hud ask-aye
bind = $mainMod, M, exec, /home/hue/.local/bin/qwave-hypr-hud toggle-ear
bind = $mainMod, D, togglespecialworkspace, qwave
bind = $mainMod, G, exec, /home/hue/.local/bin/qwave-hypr-hud a6000-pulse
bind = $mainMod, I, exec, alacritty -T "8b.is Sovereign AGY Studio (Resumed)" --working-directory /home/hue/8b-is -e /home/hue/.local/bin/qwave-hypr-hud agy-resume
bind = $mainMod SHIFT, Return, exec, alacritty -T "8b.is Sovereign AGY Studio (Resumed)" --working-directory /home/hue/8b-is -e /home/hue/.local/bin/qwave-hypr-hud agy-resume
bind = $mainMod, W, exec, /home/hue/.local/bin/qwave-hypr-hud wifi-menu
bind = $mainMod SHIFT, W, exec, /home/hue/.local/bin/qwave-hypr-hud wifi-tui

# Window Rules
windowrulev2 = float, class:^(wifi-manager)$

# Core Studio Application Launchers
bind = $mainMod, Return, exec, alacritty --working-directory /home/hue/8b-is
bind = $mainMod, B, exec, chromium --password-store=basic http://127.0.0.1:8787 https://cheet.is/a6000 https://g8t.is https://gemini-diary.8b.is
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, E, exec, alacritty -e /home/hue/.local/bin/qwave /home/hue/8b-is/qwave/README.md

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, C, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod SHIFT, L, exec, hyprctl keyword general:layout "master"
bind = $mainMod CTRL, L, exec, hyprctl keyword general:layout "dwindle"
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy

# Focus Navigation (Arrow keys & Vim keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u

# Workspace Switching (SUPER + 1..9, 0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Active Window to Workspace (SUPER + SHIFT + 1..9, 0)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, D, movetoworkspace, special:qwave

# Scroll through Workspaces & Mouse Drag/Resize
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia, PipeWire Volume, Mic Mute & Brightness Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPrev, exec, playerctl previous
